[package]
name = "clorus-replx"
version = "0.1.0"
edition = "2024"
description = "Extended REPL with smart execution and adaptive features"
license = "MIT OR Apache-2.0"

[lib]
name = "clorus_replx"
path = "src/lib.rs"

# Optional standalone binary
[[bin]]
name = "replx"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
clorus-repl = { path = "../clorus-repl" }
clorus = { path = "../clorus" }
inkwell = { workspace = true }
rustyline = "14.0"
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[features]
default = ["adaptive"]
adaptive = []
learning = []
standalone = []  # Enable standalone binary
