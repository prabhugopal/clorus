[package]
name = "clorus-repl"
version = "0.1.0"
edition = "2024"
description = "Interactive REPL for Clorus language"

[[bin]]
name = "repl"
path = "src/main.rs"

[dependencies]
clorus = { path = "../clorus" }
clorus-syntax = { path = "../clorus-syntax" }
clorus-codegen = { path = "../clorus-codegen" }
clorus-runtime = { path = "../clorus-runtime" }
clorus-cli = { path = "../clorus-cli" }
inkwell = { workspace = true }
libloading = "0.8"
rustyline = "14.0"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
