[package]
name = "clorus-codegen"
version = "0.1.0"
edition = "2021"
description = "LLVM code generation for Clorus language"
license = "MIT"

[dependencies]
clorus-syntax = { path = "../clorus-syntax" }
clorus-runtime = { path = "../clorus-runtime" }
clorus-types = { path = "../clorus-types" }
inkwell = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
