site_name: Clorus Docs
site_description: Clorus language, compiler, interop, and test coverage
repo_name: clorus
repo_url: https://github.com/yourusername/clorus

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: README.md
  - Language: LANGUAGE.md
  - Status:
    - Parity Status: generated/PARITY_STATUS.md
    - Coverage Summary: generated/COVERAGE_SUMMARY.md
  - Compiler & Architecture: COMPILER_ARCHITECTURE.md
  - GUI Platform:
    - Roadmap: gui/ROADMAP.md
    - Execution Checklist: gui/EXECUTION_CHECKLIST.md
    - Widget Parity Matrix: gui/WIDGET_PARITY_MATRIX.md
  - Rust Interop: RUST_INTEROP.md
  - Coverage Pointer: COVERAGE.md
