name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # No `set -e` in tests/run_all_tests.sh by design -- it always runs the
  # full suite and reports a complete summary, then exits non-zero on any
  # failure. CI just needs to fail the job when that happens.
  CLORUS_TEST_JOBS: 1

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is the fast, cheap primary gate for core
        # language/stdlib correctness (no macOS-only deps in this
        # workspace). macos-14 runs on Apple Silicon (arm64) -- the exact
        # platform class of the still-unverified ARM64e FFI/`let` bug
        # documented in coral's CODEGEN-BUG-REPORT.md, so this is real
        # continuous coverage for it, not just a second OS box to tick.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          # apt.llvm.org splits Polly (LLVM's polyhedral loop optimizer) out
          # of the main llvm-18/llvm-18-dev packages; llvm-sys still links
          # against it unconditionally, so without this llvm-sys fails with
          # "could not find native static library `Polly`".
          sudo apt-get install -y libpolly-18-dev ripgrep
          echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Install LLVM 18 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 ripgrep
          echo "LLVM_SYS_181_PREFIX=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build workspace (release)
        run: cargo build --release --workspace

      - name: Run Rust unit/doc tests
        run: cargo test --workspace --release

      # TEMPORARY diagnostic: tests/run_all_tests.sh redirects all test
      # invocations to /dev/null, which is hiding the real error behind
      # nearly every --legacy-run (AOT) failure on Linux while JIT passes
      # clean. Run one trivial legacy test directly, with stderr visible,
      # to see what's actually failing before touching anything.
      - name: DIAGNOSTIC - legacy-run with visible stderr
        run: |
          echo "=== plain cwd, plain env ==="
          CLORUS_ENTRY_FILE=tests/language/test-minimal.clr ./target/release/clorus run --legacy-run; echo "exit=$?"
          echo "=== harness-style: cd /tmp + isolated CARGO_TARGET_DIR/TMPDIR ==="
          mkdir -p /tmp/diag-isolation/tmp /tmp/diag-isolation/cargo-target
          CLORUS_HOME="$(pwd)" CARGO_TARGET_DIR=/tmp/diag-isolation/cargo-target TMPDIR=/tmp/diag-isolation/tmp \
            CLORUS_ENTRY_FILE="$(pwd)/tests/language/test-minimal.clr" \
            bash -c 'cd /tmp && "$0" run --legacy-run' "$(pwd)/target/release/clorus"; echo "exit=$?"

      - name: Run dual-engine language/stdlib test suite
        run: ./tests/run_all_tests.sh
